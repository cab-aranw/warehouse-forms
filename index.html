<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0" name="viewport"/>
<title>Sic Parvis Magna - Warehouse Hub</title>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet"/>

      extend: {

          "surface-container": "#161a21",
          "primary-fixed-dim": "#a27cff",
          "inverse-surface": "#f9f9ff",
          "outline": "#73757d",
          "primary-container": "#ae8dff",
          "on-error": "#490013",
          "secondary": "#c8d8f3",
          "on-primary": "#39008c",
          "outline-variant": "#45484f",
          "error": "#ff6e84",
          "tertiary-container": "#69f6b8",
          "surface-variant": "#22262f",
          "surface-tint": "#ba9eff",
          "on-error-container": "#ffb2b9",
          "secondary-container": "#38485d",
          "on-secondary-fixed": "#29394e",
          "surface-container-highest": "#22262f",
          "on-secondary-container": "#c1d1eb",
          "inverse-on-surface": "#52555c",
          "surface-container-lowest": "#000000",
          "surface": "#0b0e14",
          "on-primary-container": "#2b006e",
          "secondary-fixed": "#c8d8f3",
          "on-surface-variant": "#a9abb3",
          "secondary-dim": "#bacae4",
          "on-primary-fixed": "#000000",
          "inverse-primary": "#6e3bd7",
          "primary": "#ba9eff",
          "surface-container-high": "#1c2028",
          "error-container": "#a70138",
          "primary-fixed": "#ae8dff",
          "tertiary": "#9bffce",
          "tertiary-fixed-dim": "#58e7ab",

          "on-tertiary": "#006443",
          "on-surface": "#ecedf6",
          "surface-dim": "#0b0e14",
          "surface-container-low": "#10131a",
          "on-background": "#ecedf6",
          "on-secondary": "#3c4c61",
          "primary-dim": "#8455ef",
          "surface-bright": "#282c36",
          "tertiary-dim": "#58e7ab",

          "on-tertiary-container": "#005a3c",
        },
        fontFamily: {
          "headline": ["Manrope"],
          "body": ["Inter"],
          "label": ["Inter"]
        },
        borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },

</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  body { min-height: max(884px, 100dvh); }

  /* panels */
  .panel { display: none; }
  .panel.active { display: block; }

  /* date input styling */
  input[type="date"] {
    color-scheme: dark;
    width: 100%;
    background: #22262f;
    border: none;
    border-radius: 0.5rem;
    padding: 12px 16px;
    color: #ecedf6;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }
  input[type="date"]:focus { outline: 2px solid #ba9eff; }
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
    opacity: 0.7;
  }

  /* space grid selected state */
  .space-btn-active {
    background: rgba(186,158,255,0.25) !important;
    border-color: #ba9eff !important;
    color: #ba9eff !important;
  }

  /* paid toggle active states */
  .paid-active-yes { background: #58e7ab !important; color: #006443 !important; }
  .paid-active-no  { background: #ff6e84 !important; color: #490013 !important; }

  /* subcat selected */
  .subcat-active {
    background: rgba(186,158,255,0.2) !important;
    border-color: #ba9eff !important;
    color: #ba9eff !important;
  }

  /* category pill selected */
  .pill-active {
    background: #ba9eff !important;
    color: #39008c !important;
  }

  /* toast animation */
  .toast-show { transform: translateX(-50%) translateY(0) !important; opacity: 1 !important; }
</style>
</head>

<body class="bg-background text-on-background font-body selection:bg-primary/30 antialiased">

<!-- ── TOP APP BAR ── -->
<header class="fixed top-0 w-full flex justify-between items-center px-6 h-16 bg-[#0B0E14]/60 backdrop-blur-xl z-50">
  <div class="flex items-center gap-3">
    <span class="material-symbols-outlined text-violet-400">grid_view</span>
    <h1 class="font-headline tracking-widest uppercase font-bold text-sm text-violet-400">SIC PARVIS MAGNA</h1>
  </div>
  <div class="flex items-center gap-4">
    <div class="flex flex-col items-end">
      <span class="text-[10px] font-headline text-tertiary tracking-tighter uppercase">System Status</span>
      <span class="text-[9px] text-on-surface-variant">Online</span>
    </div>
    <div class="w-10 h-10 rounded-full bg-surface-container-highest border border-outline-variant/20 flex items-center justify-center">
      <span class="material-symbols-outlined text-primary text-xl">warehouse</span>
    </div>
  </div>
</header>

<!-- ── MAIN CONTENT ── -->
<main class="pt-20 pb-32 px-4 max-w-md mx-auto">

  <!-- Greeting -->
  <section class="mb-6">
    <h2 class="text-3xl font-headline font-extrabold tracking-tight text-on-background">Galeria Ebenezer</h2>
    <p class="text-on-surface-variant text-sm mt-1">Registro de Gastos - Ingresos</p>
  </section>

  <!-- ── SEGMENTED TABS ── -->
  <div class="bg-surface-container-low p-1.5 rounded-full flex mb-6 border border-outline-variant/10 shadow-lg">
    <button id="tab-expenses" onclick="switchTab('expenses')"
      class="flex-1 py-3 px-6 rounded-full text-sm font-medium transition-all duration-300 bg-primary text-on-primary shadow-lg shadow-primary/20">
      Expenses · <span class="opacity-70">Gastos</span>
    </button>
    <button id="tab-rental" onclick="switchTab('rental')"
      class="flex-1 py-3 px-6 rounded-full text-sm font-medium transition-all duration-300 text-on-surface-variant hover:text-on-surface">
      Rental · <span class="opacity-70">Ingresos</span>
    </button>
  </div>

  <!-- ══════════════════════════════════ -->
  <!--  PANEL 1: EXPENSES                 -->
  <!-- ══════════════════════════════════ -->
  <div id="panel-expenses" class="panel active space-y-4">

    <div class="bg-surface-container-high rounded-xl p-6 shadow-xl border border-outline-variant/5">

      <!-- Card Header -->
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-lg bg-error-container/20 flex items-center justify-center">
          <span class="material-symbols-outlined text-error">payments</span>
        </div>
        <div>
          <h3 class="font-headline font-bold text-lg leading-tight">Record Expense</h3>
          <p class="text-xs text-on-surface-variant">Registrar Gasto</p>
        </div>
      </div>

      <!-- Date + Amount Row -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="space-y-1.5">
          <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">
            Date / Fecha
          </label>
          <input type="date" id="exp-date-input" onchange="setDate('exp')"/>
        </div>
        <div class="space-y-1.5">
          <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">
            Amount / Monto
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary font-bold text-sm pointer-events-none">$</span>
            <input id="exp-amount" type="number" inputmode="decimal" step="0.01" placeholder="0.00"
              class="w-full bg-surface-variant border-none rounded-lg pl-8 pr-4 py-3 text-sm focus:ring-2 focus:ring-primary text-on-surface font-mono"/>
          </div>
        </div>
      </div>

      <!-- Category Pills -->
      <div class="space-y-1.5 mb-4">
        <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">
          Category / Categoría
        </label>
        <div class="flex gap-2 flex-wrap" id="cat-pills">
          <button onclick="selectPill(this,'Daily')"
            class="px-4 py-2 rounded-full border border-outline-variant/40 text-on-surface-variant text-xs font-bold transition-all">
            📅 Daily · Diario
          </button>
          <button onclick="selectPill(this,'Monthly')"
            class="px-4 py-2 rounded-full border border-outline-variant/40 text-on-surface-variant text-xs font-bold transition-all">
            📆 Monthly · Mensual
          </button>
          <button onclick="selectPill(this,'Misc')"
            class="px-4 py-2 rounded-full border border-outline-variant/40 text-on-surface-variant text-xs font-bold transition-all">
            📌 Misc · Otro
          </button>
        </div>
      </div>

      <!-- Subcategory Grid -->
      <div class="space-y-1.5 mb-4">
        <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">
          Subcategory / Subcategoría
        </label>
        <div class="grid grid-cols-3 gap-2" id="subcat-grid">
          <button onclick="selectSubcat(this,'Groceries')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">🛒<br>Groceries<br><span class="opacity-50 text-[9px]">Comida</span></button>
          <button onclick="selectSubcat(this,'Taxi')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">🚕<br>Taxi<br><span class="opacity-50 text-[9px]">Taxi</span></button>
          <button onclick="selectSubcat(this,'Water')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">💧<br>Water<br><span class="opacity-50 text-[9px]">Agua</span></button>
          <button onclick="selectSubcat(this,'Electricity')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">⚡<br>Electric<br><span class="opacity-50 text-[9px]">Electricidad</span></button>
          <button onclick="selectSubcat(this,'Salary A')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">👤<br>Salary A<br><span class="opacity-50 text-[9px]">Salario A</span></button>
          <button onclick="selectSubcat(this,'Salary B')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">👤<br>Salary B<br><span class="opacity-50 text-[9px]">Salario B</span></button>
          <button onclick="selectSubcat(this,'Salary C')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">👤<br>Salary C<br><span class="opacity-50 text-[9px]">Salario C</span></button>
          <button onclick="selectSubcat(this,'Housing A')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">🏠<br>Housing A<br><span class="opacity-50 text-[9px]">Vivienda A</span></button>
          <button onclick="selectSubcat(this,'Housing B')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">🏠<br>Housing B<br><span class="opacity-50 text-[9px]">Vivienda B</span></button>
          <button onclick="selectSubcat(this,'School')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">🎓<br>School<br><span class="opacity-50 text-[9px]">Escuela</span></button>
          <button onclick="selectSubcat(this,'Maintenance')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">🔧<br>Maint.<br><span class="opacity-50 text-[9px]">Mantenim.</span></button>
          <button onclick="selectSubcat(this,'Lawyer')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all">⚖️<br>Lawyer<br><span class="opacity-50 text-[9px]">Abogado</span></button>
          <button onclick="selectSubcat(this,'Other')" class="subcat-btn bg-surface-variant border border-outline-variant/30 rounded-lg py-3 text-xs font-bold text-on-surface-variant text-center transition-all col-span-3">📌 Other · Otro</button>
        </div>
      </div>

      <!-- Description -->
      <div class="space-y-1.5 mb-6">
        <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">
          Description / Descripción
        </label>
        <textarea id="exp-description" rows="2" placeholder="e.g. Walmart groceries · Compras en Walmart"
          class="w-full bg-surface-variant border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-primary text-on-surface resize-none"></textarea>
      </div>

      <!-- Submit -->
      <button onclick="submitExpense()"
        class="w-full bg-gradient-to-r from-primary to-primary-dim text-on-primary py-4 rounded-full font-headline font-extrabold text-sm tracking-widest uppercase shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
        Guardar Gasto
      </button>

    </div>
  </div>

  <!-- ══════════════════════════════════ -->
  <!--  PANEL 2: RENTAL INCOME            -->
  <!-- ══════════════════════════════════ -->
  <div id="panel-rental" class="panel space-y-4">

    <div class="bg-surface-container-high rounded-xl p-6 shadow-xl border border-outline-variant/5">

      <!-- Card Header -->
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-tertiary-container/20 flex items-center justify-center">
            <span class="material-symbols-outlined text-tertiary">warehouse</span>
          </div>
          <div>
            <h3 class="font-headline font-bold text-lg leading-tight">Pago de Alquiler</h3>
            <p class="text-xs text-on-surface-variant">Registrar Pago · Rental Income</p>
          </div>
        </div>
        <span class="text-[10px] font-bold px-3 py-1 bg-surface-variant text-tertiary-dim rounded-full">14 Locales</span>
      </div>

      <!-- Date -->
      <div class="space-y-1.5 mb-4">
        <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">
          Date / Fecha
        </label>
        <input type="date" id="rent-date-input" onchange="setDate('rent')"/>
      </div>

      <!-- Warehouse Space Grid -->
      <div class="space-y-1.5 mb-6">
        <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">
          Stand #
        </label>
        <div class="grid grid-cols-4 gap-2" id="space-grid">
          <!-- Generated by JS -->
        </div>

      </div>

      <!-- Tenant Name -->
      <div class="space-y-1.5 mb-4">
        <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">
          Tenant Name / Nombre del Inquilino
        </label>
        <input id="rent-tenant" type="text" autocomplete="off"
          placeholder="Full name · Nombre completo"
          class="w-full bg-surface-variant border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-primary text-on-surface"/>
      </div>

      <!-- Amount + Payment Status -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="space-y-1.5">
          <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">
            Amount / Monto
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-tertiary font-bold text-sm pointer-events-none">$</span>
            <input id="rent-amount" type="number" inputmode="decimal" step="0.01" placeholder="0.00"
              class="w-full bg-surface-variant border-none rounded-lg pl-8 pr-4 py-3 text-sm focus:ring-2 focus:ring-primary text-on-surface font-mono"/>
          </div>
        </div>
        <div class="space-y-1.5">
          <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">
            Status / Estado
          </label>
          <div class="flex items-center bg-surface-variant rounded-lg p-1 h-[46px]">
            <button id="paid-yes" onclick="setPaid(true)"
              class="flex-1 py-2 text-[10px] font-bold rounded-md paid-active-yes transition-all">
              ✅ PAID
            </button>
            <button id="paid-no" onclick="setPaid(false)"
              class="flex-1 py-2 text-[10px] font-bold rounded-md text-on-surface-variant transition-all">
              ❌ DUE
            </button>
          </div>
        </div>
      </div>

      <!-- Submit -->
      <button onclick="submitRental()"
        class="w-full bg-gradient-to-r from-primary to-primary-dim text-on-primary py-4 rounded-full font-headline font-extrabold text-sm tracking-widest uppercase shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
        Guardar Pago
      </button>

    </div>
  </div>

</main>

<!-- ── TOAST NOTIFICATION ── -->
<div id="toast"
  class="fixed top-20 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-surface-bright/90 backdrop-blur-xl border border-tertiary/20 rounded-2xl p-4 flex items-center gap-4 shadow-2xl z-[60] transition-all duration-500 opacity-0"
  style="transform: translateX(-50%) translateY(-150%); opacity:0;">
  <div class="w-10 h-10 rounded-full bg-tertiary-container/30 flex items-center justify-center">
    <span class="material-symbols-outlined text-tertiary" style="font-variation-settings:'FILL' 1;">check_circle</span>
  </div>
  <div>
    <p id="toast-title" class="font-headline font-bold text-sm text-on-surface">Data Vault Updated</p>
    <p id="toast-sub" class="text-xs text-on-surface-variant">Transaction logged successfully.</p>
  </div>
</div>

<!-- ── BOTTOM NAV ── -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-[#0B0E14]/80 backdrop-blur-2xl shadow-[0_-4px_40px_rgba(139,92,246,0.06)] rounded-t-[2.5rem]">
  <button onclick="switchTab('expenses')" class="flex flex-col items-center justify-center text-violet-300 bg-violet-500/20 rounded-full px-5 py-2 transition-all" id="nav-expenses">
    <span class="material-symbols-outlined mb-1">payments</span>
    <span class="font-body font-medium text-[10px] tracking-wide">Gastos</span>
  </button>
  <button onclick="switchTab('rental')" class="flex flex-col items-center justify-center text-slate-500 opacity-70 hover:text-violet-200 transition-all" id="nav-rental">
    <span class="material-symbols-outlined mb-1">account_balance_wallet</span>
    <span class="font-body font-medium text-[10px] tracking-wide">Ingresos</span>
  </button>
  <button onclick="window.location.href='dashboard.html'" class="flex flex-col items-center justify-center text-slate-600 opacity-40 hover:opacity-70 hover:text-violet-200 transition-all" id="nav-dashboard">
    <span class="material-symbols-outlined mb-1" style="font-size:18px;">analytics</span>
    <span class="font-body font-medium text-[10px] tracking-wide">Reporte</span>
  </button>
</nav>

<!-- ── JAVASCRIPT ── -->
<script>
  // ── STATE ──
  const state = {
    exp:  { date: '', category: '', subcategory: '' },
    rent: { date: '', space: '', paid: true }
  };

  // ── INIT ──
  function init() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('exp-date-input').value = today;
    document.getElementById('rent-date-input').value = today;
    state.exp.date = today;
    state.rent.date = today;
    buildSpaceGrid();
  }

  // ── BUILD SPACE GRID ──
  function buildSpaceGrid() {
    const grid = document.getElementById('space-grid');
    for (let i = 1; i <= 14; i++) {
      const btn = document.createElement('button');
      btn.className = 'space-btn aspect-square bg-surface-variant border border-outline-variant/30 text-on-surface-variant font-bold text-sm rounded-lg flex items-center justify-center transition-all active:scale-90';
      btn.textContent = i < 10 ? '0' + i : '' + i;
      btn.onclick = () => selectSpace(btn, i);
      grid.appendChild(btn);
    }
  }

  // ── TAB SWITCH ──
  function switchTab(tab) {
    const isExp = tab === 'expenses';

    document.getElementById('panel-expenses').classList.toggle('active', isExp);
    document.getElementById('panel-rental').classList.toggle('active', !isExp);

    // top tabs
    document.getElementById('tab-expenses').className = isExp
      ? 'flex-1 py-3 px-6 rounded-full text-sm font-medium transition-all duration-300 bg-primary text-on-primary shadow-lg shadow-primary/20'
      : 'flex-1 py-3 px-6 rounded-full text-sm font-medium transition-all duration-300 text-on-surface-variant hover:text-on-surface';
    document.getElementById('tab-rental').className = !isExp
      ? 'flex-1 py-3 px-6 rounded-full text-sm font-medium transition-all duration-300 bg-primary text-on-primary shadow-lg shadow-primary/20'
      : 'flex-1 py-3 px-6 rounded-full text-sm font-medium transition-all duration-300 text-on-surface-variant hover:text-on-surface';

    // bottom nav
    document.getElementById('nav-expenses').className = isExp
      ? 'flex flex-col items-center justify-center text-violet-300 bg-violet-500/20 rounded-full px-5 py-2 transition-all'
      : 'flex flex-col items-center justify-center text-slate-500 opacity-70 hover:text-violet-200 transition-all';
    document.getElementById('nav-rental').className = !isExp
      ? 'flex flex-col items-center justify-center text-violet-300 bg-violet-500/20 rounded-full px-5 py-2 transition-all'
      : 'flex flex-col items-center justify-center text-slate-500 opacity-70 hover:text-violet-200 transition-all';
  }

  // ── DATE ──
  function setDate(form) {
    const val = document.getElementById(form + '-date-input').value;
    if (form === 'exp') state.exp.date = val;
    else state.rent.date = val;
  }

  // ── CATEGORY PILLS ──
  function selectPill(btn, val) {
    document.querySelectorAll('#cat-pills button').forEach(b => b.classList.remove('pill-active'));
    btn.classList.add('pill-active');
    state.exp.category = val;
  }

  // ── SUBCATEGORY ──
  function selectSubcat(btn, val) {
    document.querySelectorAll('.subcat-btn').forEach(b => b.classList.remove('subcat-active'));
    btn.classList.add('subcat-active');
    state.exp.subcategory = val;
  }

  // ── SPACE SELECTION ──
  function selectSpace(btn, num) {
    document.querySelectorAll('.space-btn').forEach(b => b.classList.remove('space-btn-active'));
    btn.classList.add('space-btn-active');
    state.rent.space = num;
  }

  // ── PAID TOGGLE ──
  function setPaid(val) {
    state.rent.paid = val;
    const yes = document.getElementById('paid-yes');
    const no  = document.getElementById('paid-no');
    if (val) {
      yes.className = 'flex-1 py-2 text-[10px] font-bold rounded-md paid-active-yes transition-all';
      no.className  = 'flex-1 py-2 text-[10px] font-bold rounded-md text-on-surface-variant transition-all';
    } else {
      no.className  = 'flex-1 py-2 text-[10px] font-bold rounded-md paid-active-no transition-all';
      yes.className = 'flex-1 py-2 text-[10px] font-bold rounded-md text-on-surface-variant transition-all';
    }
  }

  // ── TOAST ──
  function showToast(title, sub) {
    const t = document.getElementById('toast');
    document.getElementById('toast-title').textContent = title;
    document.getElementById('toast-sub').textContent = sub;
    t.style.transform = 'translateX(-50%) translateY(0)';
    t.style.opacity = '1';
    setTimeout(() => {
      t.style.transform = 'translateX(-50%) translateY(-150%)';
      t.style.opacity = '0';
    }, 3000);
  }

  // ── SUBMIT EXPENSE ──
  function submitExpense() {
    const amount = document.getElementById('exp-amount').value;
    const desc   = document.getElementById('exp-description').value;
    const date   = document.getElementById('exp-date-input').value;

    if (!date) {
      alert('Please select a date.\nSeleccione una fecha.'); return;
    }
    if (!state.exp.category) {
      alert('Please select a category.\nSeleccione una categoría.'); return;
    }
    if (!state.exp.subcategory) {
      alert('Please select a subcategory.\nSeleccione una subcategoría.'); return;
    }
    if (!amount || parseFloat(amount) <= 0) {
      alert('Please enter a valid amount.\nIngrese un monto válido.'); return;
    }

    const payload = {
      date:        date,
      category:    state.exp.category,
      subcategory: state.exp.subcategory,
      description: desc,
      amount:      parseFloat(amount)
    };

    fetch('https://huerequeque.app.n8n.cloud/webhook/expense-entry', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(payload)
    })
    .then(() => {
      showToast('✅ Expense Recorded', 'Gasto registrado exitosamente');
      resetExpenseForm();
    })
    .catch(() => {
      alert('Connection error. Please try again.\nError de conexión. Intente de nuevo.');
    });
  }

  // ── SUBMIT RENTAL ──
  function submitRental() {
    const amount = document.getElementById('rent-amount').value;
    const tenant = document.getElementById('rent-tenant').value;
    const date   = document.getElementById('rent-date-input').value;

    if (!date) {
      alert('Please select a date.\nSeleccione una fecha.'); return;
    }
    if (!state.rent.space) {
      alert('Please select a space.\nSeleccione un espacio.'); return;
    }
    if (!tenant.trim()) {
      alert('Please enter tenant name.\nIngrese el nombre del inquilino.'); return;
    }
    if (!amount || parseFloat(amount) <= 0) {
      alert('Please enter a valid amount.\nIngrese un monto válido.'); return;
    }

    const payload = {
      date:   date,
      space:  state.rent.space,
      tenant: tenant.trim(),
      amount: parseFloat(amount),
      paid:   state.rent.paid
    };

    fetch('https://huerequeque.app.n8n.cloud/webhook/rental-entry', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(payload)
    })
    .then(() => {
      showToast('✅ Payment Posted', 'Pago registrado exitosamente');
      resetRentalForm();
    })
    .catch(() => {
      alert('Connection error. Please try again.\nError de conexión. Intente de nuevo.');
    });
  }

  // ── RESET FORMS ──
  function resetExpenseForm() {
    document.getElementById('exp-amount').value = '';
    document.getElementById('exp-description').value = '';
    document.querySelectorAll('#cat-pills button').forEach(b => b.classList.remove('pill-active'));
    document.querySelectorAll('.subcat-btn').forEach(b => b.classList.remove('subcat-active'));
    state.exp.category = '';
    state.exp.subcategory = '';
  }

  function resetRentalForm() {
    document.getElementById('rent-amount').value = '';
    document.getElementById('rent-tenant').value = '';
    document.querySelectorAll('.space-btn').forEach(b => b.classList.remove('space-btn-active'));
    state.rent.space = '';
    setPaid(true);
  }

  init();
</script>
</body>
</html>
